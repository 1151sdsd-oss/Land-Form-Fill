<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<title>土地登記申請書套印工具</title>
<style>
  :root{
    --bg:#f4f5f7; --panel:#ffffff; --border:#dcdfe4; --accent:#2563eb;
    --text:#1f2430; --muted:#6b7280; --warn:#dc2626; --warnbg:#fef2f2;
  }
  *{box-sizing:border-box;}
  body{font-family:"Microsoft JhengHei","PingFang TC",sans-serif;background:var(--bg);margin:0;color:var(--text);}
  #app{display:flex;height:100vh;}
  #sidebar{width:420px;min-width:420px;overflow-y:auto;background:var(--panel);border-right:1px solid var(--border);padding:16px;}
  #viewer{flex:1;overflow:auto;padding:24px;display:flex;flex-direction:column;align-items:center;gap:24px;background:#e5e7eb;}
  h1{font-size:17px;margin:0 0 4px;}
  h2{font-size:13px;margin:18px 0 8px;color:var(--accent);border-bottom:1px solid var(--border);padding-bottom:4px;}
  .sub{font-size:12px;color:var(--muted);margin-bottom:12px;}
  label{display:block;font-size:12px;color:var(--muted);margin-bottom:2px;}
  input[type=text],input[type=number],input[type=date],input[type=tel],select{
    width:100%;padding:6px 8px;font-size:13px;border:1px solid var(--border);border-radius:6px;margin-bottom:8px;background:#fff;color:var(--text);
  }
  .row2{display:grid;grid-template-columns:1fr 1fr;gap:8px;}
  .row3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;}
  fieldset{border:1px solid var(--border);border-radius:8px;margin-bottom:12px;padding:10px;}
  legend{font-size:12px;font-weight:bold;padding:0 6px;color:var(--text);}
  .autoval{background:#f0f4ff;color:#374151;font-size:12px;padding:6px 8px;border-radius:6px;border:1px dashed #c7d2fe;margin-bottom:8px;}
  .warnbox{background:var(--warnbg);border:1px solid #fca5a5;color:var(--warn);font-size:12px;padding:8px 10px;border-radius:6px;margin-bottom:10px;line-height:1.6;}
  .warnbox.ok{background:#f0fdf4;border-color:#86efac;color:#15803d;}
  .hintbox{background:#eff6ff;border:1px solid #93c5fd;color:#1e40af;font-size:12px;padding:8px 10px;border-radius:6px;margin-bottom:10px;line-height:1.6;display:flex;align-items:center;justify-content:space-between;gap:8px;}
  .hintbox .hinttext{flex:1;}
  .hintbox button{flex-shrink:0;padding:4px 10px;font-size:12px;}
  button{cursor:pointer;border:none;border-radius:6px;padding:8px 12px;font-size:13px;background:var(--accent);color:#fff;margin-right:6px;margin-bottom:6px;}
  button.secondary{background:#e5e7eb;color:var(--text);}
  button.calib{background:#f59e0b;}
  button.calib.active{background:#b45309;}
  .page-wrap{position:relative;background:#fff;box-shadow:0 2px 10px rgba(0,0,0,.15);}
  .page-wrap img{display:block;width:100%;height:auto;}
  .field{position:absolute;white-space:nowrap;font-family:"Microsoft JhengHei","PingFang TC",sans-serif;color:#000;font-weight:600;line-height:1;transform:translate(-2px,-2px);}
  .field.center{transform:translate(-50%,-50%);text-align:center;}
  .calib-mode .field{outline:1px dashed rgba(220,38,38,.6);cursor:move;background:rgba(255,255,0,.15);padding:1px 2px;}
  .page-label{font-size:12px;color:var(--muted);margin-bottom:6px;text-align:center;}
  .field.vertical{writing-mode:vertical-rl;text-orientation:upright;}
  .toolbar{display:flex;flex-wrap:wrap;margin-bottom:10px;}
  .coordread{font-size:11px;color:var(--muted);margin-top:-4px;margin-bottom:8px;}
  .copybadge{position:absolute;top:6px;right:6px;background:#b45309;color:#fff;font-size:11px;padding:2px 8px;border-radius:10px;display:none;}
  .small{font-size:11px;color:var(--muted);}
  @page{ size: A4 landscape; margin: 8mm; }
  @media print{
    body *{visibility:hidden;}
    #printArea, #printArea *{visibility:visible;}
    #printArea{position:absolute;left:0;top:0;width:100%;}
    .page-wrap{box-shadow:none;page-break-after:always;margin:0 auto;}
    #sidebar,.toolbar,.copybadge-ui{display:none!important;}
  }
</style>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
</head>
<body>
<div id="app">
  <div id="sidebar">
    <h1>土地登記申請書套印工具</h1>
    <div class="sub">離線單檔 HTML 工具 — 資料只存在你的瀏覽器分頁裡，不會上傳</div>

    <div class="toolbar">
      <button id="btnPrint">🖨 列印 / 存成 PDF</button>
      <button class="secondary" id="btnExportCsv">匯出設定 (CSV)</button>
      <button class="secondary" id="btnImportCsv">匯入設定</button>
      <input type="file" id="fileImportCsv" accept=".csv" style="display:none">
      <button class="calib" id="btnCalib">🎯 校正模式：關</button>
      <button class="secondary" id="btnImportXlsm">📥 匯入段名解析(xlsm)</button>
      <input type="file" id="fileImportXlsm" accept=".xlsm,.xlsx,.xls" style="display:none">
      <button class="secondary" id="btnUploadBg1">📁 上傳第1頁底圖</button>
      <input type="file" id="fileBg1" accept="image/*" style="display:none">
      <button class="secondary" id="btnUploadBg2">📁 上傳第2頁底圖</button>
      <input type="file" id="fileBg2" accept="image/*" style="display:none">
    </div>
    <div id="calibHint" class="small" style="display:none;margin-bottom:10px;color:#b45309;">
      校正模式已開啟：滑鼠拖曳右側欄位可調整位置；點選欄位後可用方向鍵微調 1px（按住 Shift 為 5px）；滑鼠移到欄位上滾動滾輪可調整字體大小（也可選取後按 + / - 鍵）。調完請按「匯出座標 (CSV)」保存，下次用「匯入座標」還原。
    </div>
    <button class="secondary" id="btnExportPos" style="display:none">匯出座標 (CSV)</button>
    <input type="file" id="filePos" accept=".csv" style="display:none">
    <button class="secondary" id="btnImportPos" style="display:none">匯入座標</button>

    <h2>基本資料</h2>
    <label>借款人</label>
    <input type="text" id="borrower" placeholder="借款人姓名">
    <div class="row2">
      <div><label>本案撥款金額(萬元)</label><input type="number" id="disburse"></div>
      <div><label>72-2額度(萬元)</label><input type="number" id="amt722"></div>
    </div>
    <div class="autoval">非72-2額度：<span id="calcNon722">0</span> 萬元　｜　本案設定筆數：<span id="calcRecordCount">-</span>　｜　本案72-2額度占比：<span id="calcRatio722">-</span></div>

    <div class="hintbox" id="selfFileHintBox" style="display:none;">
      <span class="hinttext" id="selfFileHintText"></span>
      <button type="button" class="secondary" id="btnCopySelfFileHint">複製</button>
    </div>

    <div class="row2">
      <div><label>原因發生日</label><input type="date" id="causeDate"></div>
      <div><label class="small">民國日期（自動）</label><div class="autoval" id="calcRocDate">-</div></div>
    </div>

    <div class="row2">
      <div><label>受理地政</label><input type="text" id="receivingOffice" placeholder="例：臺中市中山"></div>
      <div><label>管轄地政</label><input type="text" id="jurisdictionOffice" placeholder="例：臺中市中興"></div>
    </div>
    <div class="autoval">跨所申請：<span id="calcCrossOffice">否</span></div>

    <div class="row3">
      <div><label>土地權狀(張)</label><input type="number" id="landCert" value="1"></div>
      <div><label>建物權狀(張)</label><input type="number" id="buildingCert" value="1"></div>
      <div><label>所有權人(人數)</label><input type="number" id="ownerCount" value="1"></div>
    </div>
    <div class="autoval">身分證件份數（自動）：<span id="calcIdCount">0</span></div>

    <label>代理人手機</label>
    <input type="tel" id="agentMobile" placeholder="09XXXXXXXX（列印時自動顯示為 09XX-XXX-XXX）">

    <div id="warnBox"></div>

    <div class="row2" style="align-items:flex-end;">
      <div>
        <label>從 Excel 匯入（身分證字號／結清日期／姓名／出生日期(民國)／關係別／住所／關係人排序）</label>
        <button type="button" class="secondary" id="btnImportRoster" style="width:100%;">選擇 Excel 檔案（支援 .xlsx／.xls／.xlsm／.xlsb／.csv，如 R3_MEMBER.xlsx）</button>
        <input type="file" id="fileImportRoster" accept=".xlsx,.xls,.xlsm,.xlsb,.csv" style="display:none">
      </div>
      <div>
        <select id="rosterRecordSelect" style="display:none;width:100%;"></select>
      </div>
    </div>

    <h2>關係人 1</h2>
    <div class="row2">
      <div><label>姓名（預設同借款人）</label><input type="text" id="p1name"></div>
      <div><label>身分</label><select id="p1role"></select></div>
    </div>
    <div class="row2">
      <div><label>生日（民國，YY/MM/DD）</label><input type="text" id="p1birth" placeholder="請輸入 YY/MM/DD"></div>
      <div><label>統一編號</label><input type="text" id="p1id"></div>
    </div>
    <label>戶籍地</label>
    <input type="text" id="p1addr">

    <h2>關係人 2</h2>
    <div class="row2">
      <div><label>姓名</label><input type="text" id="p2name"></div>
      <div><label>身分</label><select id="p2role"></select></div>
    </div>
    <div class="row2">
      <div><label>生日（民國）</label><input type="text" id="p2birth" placeholder="請輸入 YY/MM/DD"></div>
      <div><label>統一編號</label><input type="text" id="p2id"></div>
    </div>
    <label>戶籍地（與借款人不同時才填，預設同關係人1）</label>
    <input type="text" id="p2addrOverride">

    <h2>關係人 3（無則留空）</h2>
    <div class="row2">
      <div><label>姓名</label><input type="text" id="p3name"></div>
      <div><label>身分</label><select id="p3role"></select></div>
    </div>
    <div class="row2">
      <div><label>生日（民國）</label><input type="text" id="p3birth"></div>
      <div><label>統一編號</label><input type="text" id="p3id"></div>
    </div>
    <label>戶籍地（與前兩人不同時才填，預設同關係人2）</label>
    <input type="text" id="p3addrOverride">

  </div>

  <div id="viewer">
    <div id="printArea">
      <div class="page-wrap" id="pageWrap1" style="width:827px;">

function $(id){return document.getElementById(id);}
function formatMobileDisplay(raw){
  const digits = String(raw || '').replace(/\D/g, '');
  if(digits.length === 10 && digits.startsWith('09')){
    return `${digits.slice(0,4)}-${digits.slice(4,7)}-${digits.slice(7,10)}`;
  }
  return raw;
}

function toRocDate(dateStr){
  if(!dateStr) return {y:'',m:'',d:'', text:'-'};
  const d = new Date(dateStr+'T00:00:00');
  const y = d.getFullYear()-1911;
  const m = d.getMonth()+1;
  const day = d.getDate();
  return {y:String(y), m:String(m), d:String(day), text:`民國 ${y} 年 ${m} 月 ${day} 日`};
}

// ---------- build field DOM elements over each page ----------
const pageWraps = {
  1: [$('pageWrap1'), $('pageWrap1b')],
  2: [$('pageWrap2'), $('pageWrap2b')]
};
const fieldEls = {}; // key -> array of DOM nodes (one per copy)

function nativeSize(page){
  return page===1 ? [PAGE1_NATIVE_W, PAGE1_NATIVE_H] : [PAGE2_NATIVE_W, PAGE2_NATIVE_H];
}

function buildFields(){
  Object.keys(POS).forEach(key=>{
    fieldEls[key] = [];
    pageWraps[POS[key].page].forEach((wrap, copyIdx)=>{
      if(!wrap) return;
      const el = document.createElement('div');
      el.className = 'field' + (POS[key].align==='center' ? ' center':'') + (POS[key].vertical ? ' vertical':'');
      el.dataset.key = key;
      el.dataset.copy = copyIdx;
      el.tabIndex = 0;
      wrap.appendChild(el);
      fieldEls[key].push(el);
    });
  });
}
buildFields();

function layoutFields(){
  Object.keys(POS).forEach(key=>{
    const p = POS[key];
    const [nw, nh] = nativeSize(p.page);
    fieldEls[key].forEach(el=>{
      const wrap = el.parentElement;
      const scale = (printScale && printScale[p.page]) ? printScale[p.page] : (wrap.getBoundingClientRect().width / nw);
      el.style.left = (p.x*scale) + 'px';
      el.style.top = (p.y*scale) + 'px';
      el.style.fontSize = (p.size*scale) + 'px';
      if(p.align==='left') el.style.textAlign='left';
      if(p.align==='center'){el.style.textAlign='center';}
      if(p.box) fitText(el, p.box, scale);
    });
  });
}

// ---------- auto-fit text: shrink (and optionally wrap) so text stays inside its cell ----------
function fitText(el, box, scale){
  if(!box) return;
  const maxW = box.w * scale;
  const maxH = box.h ? box.h * scale : null;
  el.style.whiteSpace = box.wrap ? 'normal' : 'nowrap';
  el.style.wordBreak = box.wrap ? 'break-all' : 'normal';
  el.style.width = box.wrap ? maxW + 'px' : 'auto';
  el.style.maxWidth = maxW + 'px';
  let size = parseFloat(el.style.fontSize);
  const minSize = 6;
  let guard = 0;
  while(size > minSize && guard < 60){
    const overflowW = el.scrollWidth > maxW + 0.5;
    const overflowH = maxH ? el.scrollHeight > maxH + 0.5 : false;
    if(overflowW || overflowH){
      size -= 0.5;
      el.style.fontSize = size + 'px';
    } else break;
    guard++;
  }
}
function recalc(){
  const borrower = $('borrower').value.trim();
  const disburse = parseFloat($('disburse').value)||0;
  const amt722 = parseFloat($('amt722').value)||0;
  const non722 = disburse - amt722;
  $('calcNon722').textContent = (isNaN(non722)?0:non722);

  let recordCount = '';
  if(disburse!==0 || non722!==0){
    recordCount = (amt722===0 || non722===0) ? 1 : 2;
  }
  $('calcRecordCount').textContent = recordCount || '-';
  $('copy2Container').style.display = (recordCount===2) ? '' : 'none';
  $('calcRatio722').textContent = disburse !== 0 ? (amt722/disburse*100).toFixed(2) + '%' : '-';

  const hintBox = $('selfFileHintBox');
  if(disburse !== 0){
    const val1 = Math.round(amt722 * 1.2);
    const val2 = Math.round(non722 * 1.2);
    const valT = val1 + val2;
    let hintText;
    if(amt722 === 0 || disburse === amt722){
      hintText = `本案為自行送件，共設定一筆${valT}萬元。`;
    } else {
      hintText = `本案為自行送件，共設定兩筆，第一筆${val1}萬元，第二筆${val2}萬元，共${valT}萬元。`;
    }
    $('selfFileHintText').textContent = hintText;
    hintBox.style.display = 'flex';
  } else {
    $('selfFileHintText').textContent = '';
    hintBox.style.display = 'none';
  }

  const roc = toRocDate($('causeDate').value);
  $('calcRocDate').textContent = roc.text;

  const receiving = $('receivingOffice').value.trim();
  const jurisdiction = $('jurisdictionOffice').value.trim();
  const crossOffice = (receiving && jurisdiction && receiving!==jurisdiction);
  $('calcCrossOffice').textContent = crossOffice ? '是' : '否';

  const p1id = $('p1id').value.trim();
  const p2id = $('p2id').value.trim();
  const p3id = $('p3id').value.trim();
  const idCount = [p1id,p2id,p3id].filter(v=>v).length;
  $('calcIdCount').textContent = idCount;

  // party addresses with cascading default
  const p1addr = $('p1addr').value.trim();
  const p2override = $('p2addrOverride').value.trim();
  const p2addr = p2override || p1addr;
  const p3override = $('p3addrOverride').value.trim();
  const p3addr = p3override || p2addr;

  // party1 name defaults to borrower
  const p1name = $('p1name').value.trim() || borrower;

  const roles = [$('p1role').value, $('p2role').value, $('p3role').value];
  const ownerCount = parseInt($('ownerCount').value)||0;

  // ---- validation warnings ----
  const warnings = [];
  const anyAgent = roles.some(r=>r.includes('代理'));
  const anyObligor = roles.some(r=>r.includes('義務'));
  const agentCount = roles.filter(r=>r.includes('代理')).length;
  const obligorCount = roles.filter(r=>r.includes('義務')).length;
  if(!anyAgent) warnings.push('需有一名代理人');
  if(!anyObligor) warnings.push('尚未填義務人');
  if(agentCount>1) warnings.push('不需要2名代理人');
  if(ownerCount && obligorCount!==ownerCount) warnings.push('義務人人數與所有權人數不同、請確認');
  const agentMobileRaw = $('agentMobile').value.trim();
  if(!agentMobileRaw){
    warnings.push('尚未填代理人手機');
  } else if(!/^\d{10}$/.test(agentMobileRaw.replace(/[-\s]/g, ''))){
    warnings.push('代理人手機格式錯誤，須為10碼數字');
  }
  if(disburse !== 0 && amt722 >= disburse) warnings.push('72-2額度必須小於本案撥款金額');

  const warnBox = $('warnBox');
  if(warnings.length){
    warnBox.className='warnbox';
    warnBox.innerHTML = warnings.map(w=>'⚠ '+w).join('<br>');
  } else {
    warnBox.className='warnbox ok';
    warnBox.innerHTML = '✓ 檢核通過';
  }

  // ---- write values into overlay fields (both copies share the same values) ----
  setField('receivingOffice', receiving);
  setField('jurisdictionOffice', jurisdiction);
  setField('rocYear', roc.y);
  setField('rocMonth', roc.m);
  setField('rocDay', roc.d);
  setField('crossOfficeCheck', crossOffice ? '✓' : '');
  setField('contractDocCheck', '✓');
  setField('landCertCount', $('landCert').value || '');
  setField('contractCopies', '2');
  setField('buildingCertCount', $('buildingCert').value || '');
  setField('idDocCount', idCount || '');
  setField('agentPhone', formatMobileDisplay($('agentMobile').value.trim()));

  if(recordCount===2){
    setField('copiesTotal', '2');
    setField('copyIndex', '1', [0]);
    setField('copyIndex', '2', [1]);
    setField('copy2Note', '', [0]);
    setField('copy2Note', '＼沿用前件／', [1]);
  } else {
    setField('copiesTotal', '');
    setField('copyIndex', '');
    setField('copy2Note', '');
  }

  setField('p1role', $('p1role').value);
  setField('p1name', p1name);
  setField('p1birth', $('p1birth').value.trim());
  setField('p1id', p1id);
  setField('p1addr', p1addr);

  const p2active = $('p2name').value.trim() || p2id || $('p2birth').value.trim();
  setField('p2role', p2active ? $('p2role').value : '');
  setField('p2name', $('p2name').value.trim());
  setField('p2birth', $('p2birth').value.trim());
  setField('p2id', p2id);
  setField('p2addr', p2active ? p2addr : '');

  const p3active = $('p3name').value.trim() || p3id || $('p3birth').value.trim();
  setField('p3role', p3active ? $('p3role').value : '');
  setField('p3name', $('p3name').value.trim());
  setField('p3birth', $('p3birth').value.trim());
  setField('p3id', p3id);
  setField('p3addr', p3active ? p3addr : '');

  layoutFields();
}

    if(copyIdxList && !copyIdxList.includes(idx)) return;
    el.textContent = value;

// ---------- print sizing (deterministic, not measured) ----------
// Printing forces .page-wrap to a physical mm width so each page fills the
// A4-landscape sheet correctly; getBoundingClientRect() can still report the
// *screen* size at beforeprint time in some browsers, which is what caused
// the field text to drift out of alignment with the image. Instead we compute
// the print width in mm ourselves and convert to CSS px with the fixed
// 96px-per-inch rule, so the scale used for text positions always matches
// the scale the browser actually renders the image at.
const PX_PER_MM = 96/25.4;
const PRINT_MARGIN_MM = 8;              // must match the @page margin above
const PRINT_PAGE_W_MM = 297, PRINT_PAGE_H_MM = 210; // A4 landscape
const PRINTABLE_W_MM = PRINT_PAGE_W_MM - PRINT_MARGIN_MM*2;
const PRINTABLE_H_MM = PRINT_PAGE_H_MM - PRINT_MARGIN_MM*2;
let printScale = null; // {1: scale, 2: scale} while print styling is active

function printTargetWidthMM(nw, nh){
  // fit inside the printable box, whichever dimension is the binding one
  return Math.min(PRINTABLE_W_MM, PRINTABLE_H_MM * (nw/nh));
}

function preparePrintSizes(){
  printScale = {};
  [1,2].forEach(pageNum=>{
    const [nw, nh] = nativeSize(pageNum);
    const targetMM = printTargetWidthMM(nw, nh);
    printScale[pageNum] = (targetMM * PX_PER_MM) / nw;
    (pageWraps[pageNum]||[]).forEach(wrap=>{ if(wrap) wrap.style.width = targetMM + 'mm'; });
  });
  layoutFields();
}
function restoreScreenSizes(){
  printScale = null;
  Object.values(pageWraps).flat().forEach(wrap=>{ if(wrap) wrap.style.width = '827px'; });
  layoutFields();
}
window.addEventListener('beforeprint', preparePrintSizes);
window.addEventListener('afterprint', restoreScreenSizes);

let calibOn = false;
$('btnCalib').addEventListener('click', ()=>{
  calibOn = !calibOn;
  document.body.classList.toggle('calib-mode', calibOn);
  $('btnCalib').textContent = '🎯 校正模式：' + (calibOn?'開':'關');
  $('btnCalib').classList.toggle('active', calibOn);
  $('calibHint').style.display = calibOn ? '' : 'none';
  $('btnExportPos').style.display = calibOn ? '' : 'none';
  $('btnImportPos').style.display = calibOn ? '' : 'none';
});

let dragState = null;
document.addEventListener('mousedown', e=>{
  if(!calibOn) return;
  const el = e.target.closest('.field');
  if(!el) return;
  const key = el.dataset.key;
  const [nw] = nativeSize(POS[key].page);
  const wrap = el.parentElement;
  const rect = wrap.getBoundingClientRect();
  const scale = rect.width / nw;
  dragState = {key, wrap, scale, startX:e.clientX, startY:e.clientY, origX:POS[key].x, origY:POS[key].y};
  e.preventDefault();
});
document.addEventListener('mousemove', e=>{
  if(!dragState) return;
  const dx = (e.clientX - dragState.startX) / dragState.scale;
  const dy = (e.clientY - dragState.startY) / dragState.scale;
  POS[dragState.key].x = Math.round(dragState.origX + dx);
  POS[dragState.key].y = Math.round(dragState.origY + dy);
  layoutFields();
});
document.addEventListener('mouseup', ()=>{ dragState=null; });

document.addEventListener('keydown', e=>{
  if(!calibOn) return;
  const el = document.activeElement;
  if(!el || !el.classList || !el.classList.contains('field')) return;
  const key = el.dataset.key;
  const step = e.shiftKey ? 5 : 1;
  let handled = true;
  if(e.key==='ArrowLeft') POS[key].x -= step;
  else if(e.key==='ArrowRight') POS[key].x += step;
  else if(e.key==='ArrowUp') POS[key].y -= step;
  else if(e.key==='ArrowDown') POS[key].y += step;
  else if(e.key==='+' || e.key==='=') POS[key].size = Math.max(6, POS[key].size + 1);
  else if(e.key==='-' || e.key==='_') POS[key].size = Math.max(6, POS[key].size - 1);
  else handled = false;
  if(handled){ e.preventDefault(); layoutFields(); }
});

// mouse wheel over a field (in calibration mode) adjusts its font size
document.addEventListener('wheel', e=>{
  if(!calibOn) return;
  const el = e.target.closest('.field');
  if(!el) return;
  e.preventDefault();
  const key = el.dataset.key;
  const delta = e.deltaY < 0 ? 1 : -1;
  POS[key].size = Math.max(6, POS[key].size + delta);
  layoutFields();
}, {passive:false});

// ---------- background images: auto-load external files, fallback to embedded ----------
const BG1_CANDIDATES = ['page1.png','底圖1.png','image1.png','bg1.png','page1.jpg'];
const BG2_CANDIDATES = ['page2.png','底圖2.png','image2.png','bg2.png','page2.jpg'];

function tryLoadExternalImage(candidates){
  return new Promise(resolve=>{
    let i = 0;
    function tryNext(){
      if(i >= candidates.length){ resolve(null); return; }
      const url = candidates[i++];
      const probe = new Image();
      probe.onload = ()=> resolve(url);
      probe.onerror = tryNext;
      probe.src = url;
    }
    tryNext();
  });
}

async function autoLoadBackgrounds(){
  const [url1, url2] = await Promise.all([
    tryLoadExternalImage(BG1_CANDIDATES),
    tryLoadExternalImage(BG2_CANDIDATES)
  ]);
  if(url1){
    [$('pageImg1'), $('pageImg1b')].forEach(el=>{ if(el) el.src = url1; });
  }
  if(url2){
    [$('pageImg2'), $('pageImg2b')].forEach(el=>{ if(el) el.src = url2; });
  }
  layoutFields();
}

function setupManualBgUpload(btnId, fileId, imgIds){
  $(btnId).addEventListener('click', ()=>$(fileId).click());
  $(fileId).addEventListener('change', e=>{
    const file = e.target.files[0];
    if(!file) return;
    const reader = new FileReader();
    reader.onload = ()=>{
      imgIds.forEach(id=>{ const el = $(id); if(el) el.src = reader.result; });
      layoutFields();
    };
    reader.readAsDataURL(file);
  });
}
setupManualBgUpload('btnUploadBg1', 'fileBg1', ['pageImg1','pageImg1b']);
setupManualBgUpload('btnUploadBg2', 'fileBg2', ['pageImg2','pageImg2b']);

// initial paint
// ---------- roster import: 身分證字號／結清日期／姓名／關係別 (auto-load + manual upload) ----------
const ROSTER_CANDIDATES = ['R3_MEMBER.xlsx','R2_MEMBER.xlsx','R1_MEMBER.xlsx','member.xlsx','R3_MEMBER.xlsm','R3_MEMBER.csv'];
let rosterRecords = [];

function parseRosterWorkbook(data, readType){
  let wb;
  try{
    wb = XLSX.read(data, {type: readType || 'array', cellDates:true});
  }catch(err){
    return null;
  }
  const ws = wb.Sheets[wb.SheetNames[0]];
  const rows = XLSX.utils.sheet_to_json(ws, {header:1, raw:true, defval:''});
  if(!rows.length) return null;
  const header = rows[0].map(h => String(h||'').trim());
  const idCol = header.findIndex(h => h.includes('身分證字號'));
  const dateCol = header.findIndex(h => h.includes('結清日期'));
  const nameCol = header.findIndex(h => h.includes('姓名'));
  const relationCol = header.findIndex(h => h.includes('關係別') || h.includes('關係'));
  const birthCol = header.findIndex(h => h.includes('出生日期') || h.includes('生日'));
  const orderCol = header.findIndex(h => h.includes('排序') || h.includes('順序'));
  const addrCol = header.findIndex(h => h.includes('住所'));
  if(idCol === -1) return null;
  const records = [];
  for(let i=1;i<rows.length;i++){
    const r = rows[i];
    if(!r || r.every(v => v === '' || v === undefined)) continue;
    records.push({
      name: nameCol > -1 ? String(r[nameCol] || '').trim() : '',
      id: String(r[idCol] || '').trim(),
      date: dateCol > -1 ? r[dateCol] : null,
      relation: relationCol > -1 ? String(r[relationCol] || '').trim() : '',
      birth: birthCol > -1 ? r[birthCol] : null,
      order: orderCol > -1 ? r[orderCol] : null,
      addr: addrCol > -1 ? String(r[addrCol] || '').trim() : '',
      _rowIndex: i
    });
  }
  return records.length ? records : null;
}

function excelSerialToDate(serial){
  // Excel/SheetJS 序列日期轉 JS Date（處理未被自動判斷為日期格式的儲存格，
  // 例如儲存格使用「民國年」自訂格式顯示，但底層仍是 Excel 序列數字）
  const utcDays = Math.floor(serial - 25569);
  const utcValue = utcDays * 86400;
  const dateInfo = new Date(utcValue * 1000);
  return new Date(dateInfo.getUTCFullYear(), dateInfo.getUTCMonth(), dateInfo.getUTCDate());
}

function formatRocBirth(val){
  if(val instanceof Date && !isNaN(val)){
    const rocYear = val.getFullYear() - 1911;
    const mm = String(val.getMonth()+1).padStart(2,'0');
    const dd = String(val.getDate()).padStart(2,'0');
    return `${rocYear}/${mm}/${dd}`;
  }
  if(typeof val === 'number' && !isNaN(val)){
    const d = excelSerialToDate(val);
    if(d && !isNaN(d)) return formatRocBirth(d);
    return '';
  }
  if(typeof val === 'string' && val.trim()){
    const cleaned = val.trim()
      .replace(/^民國/, '')
      .replace(/[／﹨]/g, '/')
      .replace(/年|月/g, '/')
      .replace(/日$/, '');
    const m = cleaned.match(/^(\d{1,3})[\/\-.](\d{1,2})[\/\-.]?(\d{1,2})$/);
    if(m){
      const mm = m[2].padStart(2,'0');
      const dd = m[3].padStart(2,'0');
      return `${m[1]}/${mm}/${dd}`;
    }
    return val.trim();
  }
  return '';
}

function applyRosterRecordToParty(rec, slot){
  if(!rec) return;
  if(rec.name) $(slot+'name').value = rec.name;
  if(rec.id) $(slot+'id').value = rec.id;
  if(rec.birth){
    const formatted = formatRocBirth(rec.birth);
    if(formatted) $(slot+'birth').value = formatted;
  }
  if(rec.addr){
    const addrField = slot === 'p1' ? $('p1addr') : $(slot+'addrOverride');
    if(addrField) addrField.value = rec.addr;
  }
  if(rec.relation){
    const roleSel = $(slot+'role');
    const match = Array.from(roleSel.options).find(o => o.value === rec.relation);
    if(match) roleSel.value = rec.relation;
  }
}

function applyRosterDate(rec){
  if(rec.date instanceof Date && !isNaN(rec.date)){
    const pad2 = n => String(n).padStart(2,'0');
    $('causeDate').value = `${rec.date.getFullYear()}-${pad2(rec.date.getMonth()+1)}-${pad2(rec.date.getDate())}`;
  }
}

function runRosterCascade(records, p1Idx){
  const p1Rec = records[p1Idx];
  if(!p1Rec) return;
  applyRosterRecordToParty(p1Rec, 'p1');
  applyRosterDate(p1Rec);
  recalc();
}

function applyRosterAllInOrder(records){
  const sorted = records.slice().sort((a, b)=>{
    const aHas = a.order !== null && a.order !== undefined && a.order !== '';
    const bHas = b.order !== null && b.order !== undefined && b.order !== '';
    if(aHas && bHas){
      const an = Number(a.order), bn = Number(b.order);
      if(!isNaN(an) && !isNaN(bn)) return an - bn;
      return String(a.order).localeCompare(String(b.order));
    }
    if(aHas) return -1;
    if(bHas) return 1;
    return a._rowIndex - b._rowIndex;
  });
  const slots = ['p1','p2','p3'];
  sorted.slice(0, 3).forEach((rec, i)=>{
    applyRosterRecordToParty(rec, slots[i]);
  });
  if(sorted[0]) applyRosterDate(sorted[0]);
  recalc();
}

function populateRosterSelect(records){
  rosterRecords = records;
  const sel = $('rosterRecordSelect');
  sel.innerHTML = '';
  records.forEach((rec, idx)=>{
    const opt = document.createElement('option');
    opt.value = idx;
    opt.textContent = `${rec.name || '(無姓名)'} - ${rec.id}`;
    sel.appendChild(opt);
  });

  if(records.length <= 1){
    sel.style.display = 'none';
    runRosterCascade(records, 0);
    return;
  }

  const applyAll = confirm('名單中有多筆資料，是否依「關係人排序」欄位依序自動套用到 關係人1／2／3？\n\n選「確定」＝是，全部套用依序帶入\n選「取消」＝否，我自己用下方選單選其中一筆帶入關係人1');
  if(applyAll){
    sel.style.display = 'none';
    applyRosterAllInOrder(records);
  } else {
    sel.style.display = 'block';
  }
}

$('rosterRecordSelect').addEventListener('change', e=>{
  runRosterCascade(rosterRecords, parseInt(e.target.value, 10));
});

$('btnCopySelfFileHint').addEventListener('click', ()=>{
  const text = $('selfFileHintText').textContent;
  if(!text) return;
  navigator.clipboard.writeText(text).then(()=>{
    const btn = $('btnCopySelfFileHint');
    const original = btn.textContent;
    btn.textContent = '已複製';
    setTimeout(()=>{ btn.textContent = original; }, 1500);
  }).catch(()=>{
    alert('複製失敗，請手動選取文字複製');
  });
});

$('btnImportRoster').addEventListener('click', ()=>$('fileImportRoster').click());
$('fileImportRoster').addEventListener('change', e=>{
  const file = e.target.files[0];
  if(!file) return;
  const isCsv = /\.csv$/i.test(file.name);
  const reader = new FileReader();
  reader.onload = evt=>{
    const records = parseRosterWorkbook(evt.target.result, isCsv ? 'string' : 'array');
    if(!records){
      alert('找不到「身分證字號」欄位，或檔案沒有可用資料列，請確認檔案格式');
      return;
    }
    populateRosterSelect(records);
  };
  if(isCsv){
    reader.readAsText(file, 'utf-8');
  } else {
    reader.readAsArrayBuffer(file);
  }
});

async function autoLoadRoster(){
  for(const name of ROSTER_CANDIDATES){
    try{
      const resp = await fetch(name);
      if(!resp.ok) continue;
      const isCsv = /\.csv$/i.test(name);
      const records = isCsv
        ? parseRosterWorkbook(await resp.text(), 'string')
        : parseRosterWorkbook(await resp.arrayBuffer(), 'array');
      if(records){ populateRosterSelect(records); return; }
    }catch(err){
      // 瀏覽器以 file:// 開啟時可能無法自動讀取本機檔案，屬正常情況，改用手動上傳即可
    }
  }
}

window.addEventListener('load', ()=>{ recalc(); layoutFields(); autoLoadBackgrounds(); autoLoadRoster(); });
</script>
